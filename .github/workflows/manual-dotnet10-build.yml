name: .NET 10 build and offline smoke checks

on:
  pull_request:
    branches:
      - master
      - 'codex/v0.2.0-dotnet10-reproducible-gateway-20261109'
      - 'codex/v0.3.0-safe-sqlite-events-20261109'
      - 'codex/v0.4.0-authenticated-bridge-20261109'
      - 'codex/v0.5.0-policy-calendar-20261109'
      - 'codex/v0.6.0-consent-outbox-dryrun-20261109'
      - 'codex/v0.7.0-oidc-rbac-corrections-20261109'
      - 'codex/v0.8.0-hebrew-rtl-admin-ui-20261109'
      - 'codex/v0.9.0-observability-fault-injection-20261109'
      - 'codex/v0.10.0-encrypted-backup-staging-pilot-20261109'
      - 'codex/v1.0.0-rc-evidence-no-go-20261109'
    paths:
      - 'AttendanceSystem/**'
      - 'AttendanceSystem.sln'
      - 'global.json'
      - '.github/workflows/manual-dotnet10-build.yml'
      - 'deploy/staging/**'
      - 'deploy/release/**'
      - 'docs/RELEASE_*.md'
      - 'docs/STAGING_AND_PILOT.md'
      - 'docs/PILOT_DAY_TEMPLATE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head (no production data)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore AttendanceSystem.sln
      - name: Build Release
        run: dotnet build AttendanceSystem.sln --configuration Release --no-restore
      - name: Enforce transitive NuGet dependency removal and emit resolved graph
        shell: pwsh
        run: ./deploy/release/audit-resolved-nuget.ps1 -Project AttendanceSystem/AttendanceSystem.csproj -OutputDirectory (Join-Path $env:RUNNER_TEMP 'attendance-dependency-evidence')
      - name: Upload resolved NuGet inventory (not a complete SBOM)
        uses: actions/upload-artifact@v4
        with:
          name: attendance-nuget-resolved-no-go-${{ github.run_id }}
          path: ${{ runner.temp }}/attendance-dependency-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Configuration smoke checks (no external integrations)
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test
      - name: Synthetic SQLite migration, backup and dedup checks
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test-db
      - name: Authenticated bridge synthetic 1000-event and negative checks
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test-bridge
      - name: Attendance policy, Israel DST, audit and offline Hebcal fixture checks
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test-rules
      - name: Consent-gated offline notification outbox smoke
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test-outbox
      - name: Synthetic OIDC JWT RBAC and append-only correction HTTP checks
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test-api
      - name: Hebrew RTL UI localhost and security smoke
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test-ui
      - name: Check browser JavaScript syntax
        run: node --check AttendanceSystem/AdminUi/app.js
      - name: Offline SQLite failure injection and operational metrics smoke
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test-faults
      - name: Synthetic staging preflight (no credentials or live device)
        shell: pwsh
        run: ./deploy/staging/preflight.ps1 -SyntheticOnly
      - name: AES-256-GCM encrypted SQLite backup and restore synthetic checks
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test-snapshots
      - name: Two-week pilot evidence gate synthetic checks
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test-pilot
      - name: Release governance fail-closed smoke
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test-release
      - name: Produce source-only unsigned NO-GO release candidate evidence
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./deploy/release/create-rc-evidence.ps1 -SyntheticOnly -ExpectedHeadSha $env:EXPECTED_SOURCE_SHA -OutputDirectory (Join-Path $env:RUNNER_TEMP 'attendance-rc-evidence')
          ./deploy/release/verify-rc-evidence.ps1 -SyntheticOnly -ExpectedHeadSha $env:EXPECTED_SOURCE_SHA -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'attendance-rc-evidence')
      - name: Upload unsigned NO-GO source evidence (not release binaries)
        uses: actions/upload-artifact@v4
        with:
          name: attendance-v1-rc-no-go-source-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/attendance-rc-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Verify safe startup configuration
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --check-config
      - name: Verify disabled-by-default startup
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build
