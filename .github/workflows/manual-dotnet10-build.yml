name: .NET 10 build and offline smoke checks

on:
  pull_request:
    branches:
      - master
      - 'codex/v0.2.0-dotnet10-reproducible-gateway-20261109'
      - 'codex/v0.3.0-safe-sqlite-events-20261109'
      - 'codex/v0.4.0-authenticated-bridge-20261109'
      - 'codex/v0.5.0-policy-calendar-20261109'
      - 'codex/v0.6.0-consent-outbox-dryrun-20261109'
      - 'codex/v0.7.0-oidc-rbac-corrections-20261109'
      - 'codex/v0.8.0-hebrew-rtl-admin-ui-20261109'
      - 'codex/v0.9.0-observability-fault-injection-20261109'
      - 'codex/v0.10.0-encrypted-backup-staging-pilot-20261109'
      - 'codex/v1.0.0-rc-evidence-no-go-20261109'
      - 'codex/v1.0.0-rc1-nuget-supply-chain-20261109'
      - 'codex/v1.0.0-rc2-sqlite-2.0.4-migration-20261109'
      - 'codex/v1.0.0-rc3-legacy-sqlite-compat-20261109'
      - 'codex/v1.0.0-rc4-legacy-schema-preflight-20261109'
      - 'codex/v1.0.0-rc5-explicit-synthetic-migration-gate-20261109'
      - 'codex/v1.0.0-rc6-synthetic-migration-rehearsal-20261109'
      - 'codex/v1.0.0-rc7-dual-signed-synthetic-approvals-20261109'
      - 'codex/v1.0.0-rc8-reviewer-trust-durable-replay-20261109'
      - 'codex/v1.0.0-rc9-offline-root-trust-20261109'
      - 'codex/v1.0.0-rc10-detached-signed-audit-checkpoints-20261109'
    paths:
      - 'AttendanceSystem/**'
      - 'AttendanceSystem.sln'
      - 'tests/LegacyProviderFixture/**'
      - 'tests/SyntheticEvidenceVerifier/**'
      - 'docs/SQLITE_V1_COMPATIBILITY.md'
      - 'docs/SQLITE_MIGRATION_PREFLIGHT.md'
      - 'docs/SQLITE_PUBLIC_UPGRADE_GATE.md'
      - 'docs/SQLITE_MIGRATION_REHEARSAL.md'
      - 'docs/SQLITE_SYNTHETIC_SIGNED_REVIEWS.md'
      - 'docs/SQLITE_REVIEWER_TRUST_AND_REPLAY.md'
      - 'docs/SQLITE_OFFLINE_ROOT_TRUST.md'
      - 'docs/SQLITE_DETACHED_AUDIT_CHECKPOINTS.md'
      - 'docs/SQLITE_INDEPENDENT_WITNESS.md'
      - 'global.json'
      - '.github/workflows/manual-dotnet10-build.yml'
      - 'deploy/staging/**'
      - 'deploy/release/**'
      - 'docs/RELEASE_*.md'
      - 'docs/STAGING_AND_PILOT.md'
      - 'docs/PILOT_DAY_TEMPLATE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head (no production data)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore AttendanceSystem.sln
      - name: Build Release
        run: dotnet build AttendanceSystem.sln --configuration Release --no-restore
      - name: Enforce transitive NuGet dependency removal and emit resolved graph
        shell: pwsh
        run: ./deploy/release/audit-resolved-nuget.ps1 -Project AttendanceSystem/AttendanceSystem.csproj -OutputDirectory (Join-Path $env:RUNNER_TEMP 'attendance-dependency-evidence')
      - name: Upload resolved NuGet inventory (not a complete SBOM)
        uses: actions/upload-artifact@v4
        with:
          name: attendance-nuget-resolved-no-go-${{ github.run_id }}
          path: ${{ runner.temp }}/attendance-dependency-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Configuration smoke checks (no external integrations)
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test
      - name: SQLite migration, public bypass denial, test fixture path and dedup checks
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test-db
      - name: Synthetic detached audit plus separate-process witness verification with private CI pin handoff
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path ([IO.Path]::GetTempPath()) ("attendance-legacy-fixture-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $dir | Out-Null
          $evidence = Join-Path ([IO.Path]::GetTempPath()) "attendance-rc6-migration-evidence"
          if (Test-Path -LiteralPath $evidence) {
            throw 'Migration evidence directory must start absent.'
          }
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $pins = Join-Path ([IO.Path]::GetTempPath()) ("attendance-rc11-witness-pins-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $pins -ErrorAction Stop | Out-Null
          try {
            $env:ATTENDANCE_SYNTHETIC_FIXTURES = "true"
            $env:ATTENDANCE_SYNTHETIC_WITNESS_PINS_DIR = $pins
            $env:ATTENDANCE_MIGRATION_EVIDENCE_DIR = $evidence
            $env:ATTENDANCE_LEGACY_FIXTURE_DIR = $dir
            dotnet run --project tests/LegacyProviderFixture/LegacyProviderFixture.csproj --configuration Release -- "$dir"
            if ($LASTEXITCODE -ne 0) { throw 'Legacy provider 1.x fixture creation failed.' }
            dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test-legacy-compat
            if ($LASTEXITCODE -ne 0) { throw 'SQLite v2 legacy compatibility check failed.' }
            # Separate .NET process has NO reference to application's SQLite,
            # migration or signer code. Pins live outside uploaded evidence.
            dotnet run --project tests/SyntheticEvidenceVerifier/SyntheticEvidenceVerifier.csproj --configuration Release -- --verify "$evidence" "$pins"
            if ($LASTEXITCODE -ne 0) { throw 'Independent synthetic witness failed.' }
            dotnet run --project tests/SyntheticEvidenceVerifier/SyntheticEvidenceVerifier.csproj --configuration Release --no-build -- --self-test "$evidence" "$pins"
            if ($LASTEXITCODE -ne 0) { throw 'Synthetic witness negative controls failed.' }
            $manifest = Join-Path $evidence "migration-rehearsal.json"
            $checksums = Join-Path $evidence "SHA256SUMS.txt"
            if (-not (Test-Path $manifest) -or -not (Test-Path $checksums)) {
              throw 'Synthetic-only recovery evidence was not produced.'
            }
            $report = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
            if ($report.decision -ne "NO-GO" -or
                $report.productionMigrationAuthorized -ne $false -or
                $report.generatedDataOnly -ne $true -or
                $report.signed -ne $false -or
                @($report.result).Count -ne 2 -or
                @($report.result | Where-Object {
                  $_.syntheticDualReviewVerified -ne $true -or
                  $_.durableReviewLedgerUsed -ne $true -or
                  $_.offlineRootTrustVerified -ne $true -or
                  $_.auditTrailRecorded -ne $true
                }).Count -ne 0) {
              throw 'Migration evidence does not have a safe NO-GO contract.'
            }
            $actual = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = (Get-Content -LiteralPath $checksums -Raw).Trim().Split(' ')[0]
            if ($actual -ne $expected) {
              throw 'Migration evidence integrity digest mismatch.'
            }
            foreach ($schema in @(0, 1)) {
              $checkpointFile = Join-Path $evidence ("audit-checkpoint-schema" + $schema + ".json")
              if (-not (Test-Path -LiteralPath $checkpointFile)) {
                throw 'Detached audit checkpoint missing.'
              }
              $checkpoint = Get-Content -LiteralPath $checkpointFile -Raw | ConvertFrom-Json
              if ($checkpoint.format -ne "attendance-synthetic-detached-audit-v1" -or
                  $checkpoint.purpose -ne "synthetic-recovery-audit-checkpoint-only" -or
                  $checkpoint.sourceSchemaVersion -ne $schema -or
                  $checkpoint.entries -ne 2 -or
                  $checkpoint.headHash -notmatch '^[A-F0-9]{64}$' -or
                  $checkpoint.signatureBase64 -eq "" -or
                  $checkpoint.syntheticOnly -ne $true -or
                  $checkpoint.productionAuthorized -ne $false -or
                  $checkpoint.decision -ne "NO-GO") {
                throw 'Detached audit checkpoint has an unsafe or incomplete contract.'
              }
              $publicKey = [Convert]::FromBase64String($checkpoint.testPublicKeySpkiBase64)
              $fingerprint = [Convert]::ToHexString(
                [System.Security.Cryptography.SHA256]::HashData($publicKey))
              if ($fingerprint -ne $checkpoint.testKeyFingerprint) {
                throw 'Synthetic checkpoint public-key fingerprint mismatch.'
              }
            }
            $artifactOutput = Join-Path $env:RUNNER_TEMP "attendance-rc6-migration-evidence"
            New-Item -ItemType Directory -Path $artifactOutput -ErrorAction Stop | Out-Null
            Copy-Item -LiteralPath $manifest -Destination $artifactOutput
            Copy-Item -LiteralPath $checksums -Destination $artifactOutput
            foreach ($schema in @(0, 1)) {
              $checkpointFile = Join-Path $evidence ("audit-checkpoint-schema" + $schema + ".json")
              Copy-Item -LiteralPath $checkpointFile -Destination $artifactOutput
            }
            if (@(Get-ChildItem -LiteralPath $artifactOutput -File).Count -ne 4) {
              throw 'Only four non-PII evidence files may be archived.'
            }
          }
          finally {
            Remove-Item Env:ATTENDANCE_SYNTHETIC_WITNESS_PINS_DIR -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $pins) {
              Remove-Item -LiteralPath $pins -Recurse -Force
            }
            Remove-Item Env:ATTENDANCE_MIGRATION_EVIDENCE_DIR -ErrorAction SilentlyContinue
            Remove-Item Env:ATTENDANCE_SYNTHETIC_FIXTURES -ErrorAction SilentlyContinue
            Remove-Item Env:ATTENDANCE_LEGACY_FIXTURE_DIR -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $dir) { Remove-Item -LiteralPath $dir -Recurse -Force }
            if (Test-Path -LiteralPath $evidence) {
              Remove-Item -LiteralPath $evidence -Recurse -Force
            }
          }
      - name: Upload synthetic-only SQLite recovery evidence (NOT production approval)
        uses: actions/upload-artifact@v4
        with:
          name: attendance-rc11-independent-witness-no-go-${{ github.run_id }}
          path: ${{ runner.temp }}/attendance-rc6-migration-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Authenticated bridge synthetic 1000-event and negative checks
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test-bridge
      - name: Attendance policy, Israel DST, audit and offline Hebcal fixture checks
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test-rules
      - name: Consent-gated offline notification outbox smoke
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test-outbox
      - name: Synthetic OIDC JWT RBAC and append-only correction HTTP checks
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test-api
      - name: Hebrew RTL UI localhost and security smoke
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test-ui
      - name: Check browser JavaScript syntax
        run: node --check AttendanceSystem/AdminUi/app.js
      - name: Offline SQLite failure injection and operational metrics smoke
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test-faults
      - name: Synthetic staging preflight (no credentials or live device)
        shell: pwsh
        run: ./deploy/staging/preflight.ps1 -SyntheticOnly
      - name: AES-256-GCM encrypted SQLite backup and restore synthetic checks
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test-snapshots
      - name: Two-week pilot evidence gate synthetic checks
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test-pilot
      - name: Release governance fail-closed smoke
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --self-test-release
      - name: Produce source-only unsigned NO-GO release candidate evidence
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./deploy/release/create-rc-evidence.ps1 -SyntheticOnly -ExpectedHeadSha $env:EXPECTED_SOURCE_SHA -OutputDirectory (Join-Path $env:RUNNER_TEMP 'attendance-rc-evidence')
          ./deploy/release/verify-rc-evidence.ps1 -SyntheticOnly -ExpectedHeadSha $env:EXPECTED_SOURCE_SHA -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'attendance-rc-evidence')
      - name: Upload unsigned NO-GO source evidence (not release binaries)
        uses: actions/upload-artifact@v4
        with:
          name: attendance-v1-rc-no-go-source-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/attendance-rc-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Verify safe startup configuration
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build -- --check-config
      - name: Verify disabled-by-default startup
        run: dotnet run --project AttendanceSystem/AttendanceSystem.csproj --configuration Release --no-build
